server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # El navegador utiliza un único origen. Nginx envía las solicitudes de API
    # al backend privado y mantiene funcionales autenticación, reportes y
    # evidencias protegidas sin publicar el puerto de Express.
    client_max_body_size 320m;
    location = /api {
        proxy_pass http://backend:3000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Assets con hash en el nombre (los que genera Vite): cachear fuerte.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Todo lo demás cae a index.html: es un SPA con rutas de React Router
    # (/seguridad/casos, /jefe/planes/:codigo, etc.) que no existen como
    # archivo — el mismo motivo por el que el despliegue en Vercel necesita su
    # propio rewrite (ver frontend/vercel.json).
    #
    # index.html sí necesita "no-cache" explícito: sin esto, nginx no manda
    # ningún Cache-Control y el navegador lo guarda con su propia heurística
    # — apunta a los nombres con hash de los JS, así que un index.html viejo
    # en caché sigue pidiendo bundles de una imagen anterior que ya no existe.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
